<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task Planner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Daily Task Planner</h1>
        <p id="currentDate"></p>
        <div class="task-card">

    <h4 class="mb-3">Add New Task</h4>

    <div class="task-input">
        <input type="text" id="taskInput"
            class="form-control"
            placeholder="Enter your task">
    </div>

    <button class="btn btn-primary w-100" onclick="addTask()">
        Add Task
    </button>

    <hr>

    <h4>My Tasks</h4>
    <div class="btn-group w-100 my-3">
    <button class="btn btn-outline-primary" onclick="filterTasks('all')">All</button>
    <button class="btn btn-outline-primary" onclick="filterTasks('pending')">Pending</button>
    <button class="btn btn-outline-primary" onclick="filterTasks('completed')">Completed</button>
</div>

    <div id="taskList"></div>

</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
